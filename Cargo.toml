[package]
name = "kiro-api"
version = "0.1.0"
edition = "2021"
description = "Kiro-API — local OpenAI-compatible /v1 bridge to the Kiro CLI, with a management TUI"
license = "MIT"
readme = "README.md"
keywords = ["kiro", "openai", "api", "proxy", "tui"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["tokio", "http1", "json", "query"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = "0.3.34"
parking_lot = "0.12.5"
portable-pty = "0.8.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
vt100 = "0.15.2"

[[bin]]
name = "kiro-api"
path = "src/main.rs"
