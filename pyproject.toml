[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiro-api"
version = "3.0.0"
description = "CLI-driven Linux service exposing kiro-cli as OpenAI/Anthropic/ACP-compatible HTTP APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Kiro-API" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
tray = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
kiro-api = "kiro_api.cli:main"
kiro-api-tray = "kiro_api.tray.app:main"

[tool.setuptools.packages.find]
include = ["kiro_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
markers = [
    "integration: end-to-end tests that boot the app against the ACP stub",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tray/previews", "docs", "vendor", "wheelhouse"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]  # line length handled by formatter; B008 for FastAPI Depends
